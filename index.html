.ch-top{display:flex;align-items:center;gap:10px}.ch-ic{font-size:30px}.ch-nm{flex:1;font-weight:800;font-size:15px}.ch-nm small{display:block;font-weight:600;color:#ffcf3d;font-size:12px;margin-top:2px}

.col-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:6px}

#tPadKnob{position:absolute;left:calc(50% - 22px);top:calc(50% - 22px);width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.25);border:2px solid rgba(255,255,255,.6);transition:transform .05s;pointer-events:none}
#tPad.on #tPadKnob{background:rgba(225,6,0,.55);border-color:#fff}
body.layA #tPad{left:calc(2vw + var(--safe-l));bottom:38vh;width:max(17vw,90px);height:28vh}
body.layB #tPad{left:calc(2vw + var(--safe-l));bottom:calc(4vh + var(--safe-b));width:max(31vw,170px);height:34vh}
.preset-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin-bottom:6px}
.preset{text-align:left;color:#fff;background:rgba(255,255,255,.05);border:1px solid var(--line);padding:9px 10px;display:flex;flex-direction:column;gap:3px;font-family:'Noto Sans JP'}
.preset b{font-size:14px}.preset small{font-size:11px;color:#aaa;line-height:1.4}
.preset.on{border-color:var(--red);background:rgba(225,6,0,.22)}.preset.ro{opacity:.6}.preset.ro.on{opacity:1}

.meter-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.mcard{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 4px;background:rgba(255,255,255,.04);border:1px solid var(--line);color:#fff;font-family:'Noto Sans JP'}
.mcard b{font-size:11px;line-height:1.25}.mcard small{font-size:9.5px;color:#aaa}.mcard.on{border-color:var(--red);background:rgba(225,6,0,.2)}.mcard.lock{opacity:.4}

/* ---- アドベントカレンダー ---- */
.adv-head{background:linear-gradient(120deg,#5a0010,#0f3d25);border:1px solid #2fbf71;padding:10px 12px;margin-bottom:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.adv-t{display:flex;gap:10px;align-items:center}.adv-t b{display:block;font-size:17px}.adv-t small{font-size:11px;color:#dde}
.adv-cd{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:12px;color:#fff}.adv-cd b{font-family:Orbitron;font-size:16px;color:#ffd76a}.adv-dev{color:#ffcf3d}
.adv-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.door{position:relative;aspect-ratio:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:linear-gradient(160deg,#7a0d1c,#3a0610);border:2px solid #a8323f;color:#fff;font-family:'Noto Sans JP';padding:4px;overflow:hidden}
.door:nth-child(even){background:linear-gradient(160deg,#145a35,#08301c);border-color:#2f8a55}
.door .dn{position:absolute;left:5px;top:3px;font-family:Orbitron;font-weight:900;font-size:clamp(12px,2.6vw,18px);color:#ffd76a;text-shadow:0 1px 2px #000}
.door .dl{font-size:9.5px;line-height:1.2;text-align:center;max-height:2.4em;overflow:hidden;color:#eee}
.door.big{grid-column:span 5;aspect-ratio:auto;min-height:84px;background:linear-gradient(120deg,#8a6a10,#3a2a05);border-color:#ffd76a}
.door.can{box-shadow:0 0 0 2px #ffd76a inset}.door.today{animation:advGlow 1.2s ease-in-out infinite alternate}
@keyframes advGlow{from{box-shadow:0 0 0 2px #ffd76a inset,0 0 6px #ffd76a}to{box-shadow:0 0 0 3px #fff inset,0 0 18px #ffd76a}}
.door.opened{background:#15161b!important;border-color:#333!important}.door.opened .dn{color:#888}

/* ---- 新メインメニュー ---- */
.mm-sec{font-family:Orbitron;font-weight:900;font-size:10px;letter-spacing:.35em;color:#8a8f99;margin:8px 2px 4px;display:flex;align-items:center;gap:8px}
.mm-sec::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(255,255,255,.25),transparent)}
.mm-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mt{position:relative;display:flex;align-items:center;gap:9px;text-align:left;color:#fff;background:linear-gradient(135deg,rgba(26,28,34,.94),rgba(14,15,19,.86));border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:8px 10px;min-height:50px;font-family:'Noto Sans JP';transition:transform .12s,border-color .12s,background .12s;backdrop-filter:blur(4px)}
.mt:hover,.mt:focus{border-color:var(--red);background:linear-gradient(135deg,rgba(80,10,10,.95),rgba(20,12,14,.9));outline:none}
.mt:active{transform:scale(.97)}
.mt-ic{flex:0 0 auto;display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:9px;background:rgba(255,255,255,.06)}
.mt-tx{display:flex;flex-direction:column;min-width:0}.mt-tx b{font-size:14px;font-weight:900;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mt-tx small{font-family:Orbitron;font-size:8.5px;letter-spacing:.12em;color:#9aa0aa;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mt-tx em{font-style:normal;font-size:11px;color:#ffcf3d;margin-top:2px}
.mt.hero{grid-column:span 2;min-height:64px;background:linear-gradient(120deg,rgba(150,10,10,.92),rgba(30,8,10,.88));border-color:rgba(255,80,60,.5)}
.mt.hero .mt-ic{width:46px;height:46px;background:rgba(0,0,0,.25)}.mt.hero .mt-tx b{font-size:18px}
.mt.wide{width:100%;margin-top:8px;min-height:42px}
.mt-bd{position:absolute;right:6px;top:5px;font-style:normal;font-family:Orbitron;font-weight:900;font-size:9px;letter-spacing:.05em;background:var(--red);color:#fff;padding:2px 6px;border-radius:20px;animation:bdP 1.4s ease-in-out infinite alternate}
.mt-bd.g{background:#1fa85a}@keyframes bdP{from{opacity:.75}to{opacity:1}}
.mm-ban{display:flex;align-items:center;gap:10px;width:100%;text-align:left;color:#fff;background:linear-gradient(110deg,#7a0d1c,#145a35);border:1px solid #ffd76a;border-radius:10px;padding:8px 12px;font-family:'Noto Sans JP';box-shadow:0 0 14px rgba(255,215,106,.25)}
.mm-ban b{display:block;font-size:13px}.mm-ban small{font-size:11px;color:#ffe9a8}
@media (max-height:500px) and (orientation:landscape){ .mt{min-height:44px;padding:6px 8px}.mt-ic{width:30px;height:30px}.mt-tx b{font-size:13px}.mt.hero{min-height:52px}.mt.hero .mt-tx b{font-size:16px}.mm-sec{margin:6px 2px 3px} }
@media (orientation:portrait){ .mm-grid{grid-template-columns:repeat(3,1fr)} .mt.hero{grid-column:span 3} }

/* ---- 開発者メニュー ---- */
.mt.dev{border-color:rgba(255,207,61,.6);background:linear-gradient(135deg,rgba(70,55,10,.95),rgba(20,16,6,.9))}
.dv-head{display:flex;gap:10px;align-items:center;background:linear-gradient(110deg,#3a2c05,#15120a);border:1px solid #ffcf3d;padding:9px 12px;margin-bottom:8px}.dv-head b{display:block;font-size:16px;color:#ffcf3d}.dv-head small{font-size:11px;color:#ddd}
.dv-stat{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;background:rgba(0,0,0,.3);padding:8px 12px;margin-bottom:8px;font-size:12px}.dv-stat b{font-family:Orbitron;color:#ffcf3d;text-align:right}
.dv-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line)}.dv-row b{display:block;font-size:14px}.dv-row small{display:block;font-size:11px;color:#aaa;margin-top:2px}
.tgl{flex:0 0 auto;width:50px;height:28px;border-radius:20px;background:#444;border:0;position:relative;transition:background .15s}.tgl i{position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s}.tgl.on{background:#1fa85a}.tgl.on i{left:25px}
.btn.danger{background:#7a0d0d;border-color:#ff4040;color:#fff}

button,[data-a],[data-m]{touch-action:manipulation;-webkit-tap-highlight-color:rgba(255,255,255,.08)}

<script>(function(){

// 頂点: pos3 nor3 col3 ext2(emissive, sunVis) uv2 = 13 floats
const VSTRIDE = 13;
class GB {

    let nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx; const l = Math.hypot(nx, ny, nz) || 1; nx /= l; ny /= l; nz /= l;
    uv = uv || [0, 0, 0, 0, 0, 0];

  }

  box(cx, cy, cz, sx, sy, sz, c, yaw = 0, top = null) {
    const hx = sx / 2, hy = sy / 2, hz = sz / 2, co = Math.cos(yaw), si = Math.sin(yaw);

const LIT_VS = `

// 環境プリセット（時間帯×天候）
function makeEnv(time, weather) {
  const E = {
    day: { zenith: [0.22, 0.42, 0.78], horizon: [0.68, 0.78, 0.9], sunCol: [1.05, 0.98, 0.88], skyCol: [0.42, 0.48, 0.58], groundCol: [0.26, 0.23, 0.2], sunDir: [0.45, 0.75, 0.35], fogDen: 0.0014, night: 0, stars: 0 },
    evening: { zenith: [0.18, 0.2, 0.42], horizon: [1.0, 0.56, 0.32], sunCol: [1.1, 0.62, 0.34], skyCol: [0.36, 0.3, 0.38], groundCol: [0.22, 0.15, 0.12], sunDir: [-0.7, 0.16, 0.5], fogDen: 0.0016, night: 0.35, stars: 0 },
    night: { zenith: [0.008, 0.012, 0.035], horizon: [0.05, 0.06, 0.1], sunCol: [0.18, 0.22, 0.34], skyCol: [0.06, 0.07, 0.11], groundCol: [0.03, 0.03, 0.04], sunDir: [0.3, 0.8, -0.4], fogDen: 0.0016, night: 1, stars: 1 }
  }[time] || null;
  const e = JSON.parse(JSON.stringify(E || {}));
  const l = Math.hypot(...e.sunDir); e.sunDir = e.sunDir.map(v => v / l);
  e.fogCol = e.horizon.slice(); e.wet = 0; e.skyFog = 0; e.grip = 1; e.time = time; e.weather = weather;
  if (weather === 'rain') {
    e.zenith = mixc(e.zenith, [0.3, 0.32, 0.36], 0.7); e.horizon = mixc(e.horizon, [0.42, 0.45, 0.5], 0.6); e.sunCol = scalec(e.sunCol, 0.35); e.skyCol = scalec(e.skyCol, 0.85);
    if (time === 'night') { e.zenith = [0.02, 0.025, 0.035]; e.horizon = [0.05, 0.055, 0.07]; }
    e.fogCol = e.horizon.slice(); e.fogDen = 0.0042; e.wet = 1; e.grip = 0.74; e.skyFog = 0.6; e.stars = 0;
  } else if (weather === 'snow') {
    e.zenith = mixc(e.zenith, [0.6, 0.65, 0.72], 0.6); e.horizon = mixc(e.horizon, [0.78, 0.82, 0.88], 0.6); e.sunCol = scalec(e.sunCol, 0.5);
    if (time === 'night') { e.zenith = [0.03, 0.035, 0.06]; e.horizon = [0.1, 0.11, 0.16]; e.sunCol = [0.15, 0.17, 0.25]; }
    e.skyCol = mixc(e.skyCol, [0.6, 0.64, 0.7], time === 'night' ? 0.15 : 0.5); e.groundCol = mixc(e.groundCol, [0.6, 0.62, 0.66], time === 'night' ? 0.1 : 0.6);
    e.fogCol = e.horizon.slice(); e.fogDen = 0.0036; e.grip = 0.52; e.skyFog = 0.5; e.stars = time === 'night' ? 0.3 : 0;
  } else if (weather === 'fog') {
    e.fogCol = mixc(e.horizon, [0.7, 0.72, 0.75], time === 'night' ? 0.05 : 0.6); if (time === 'night') e.fogCol = [0.06, 0.065, 0.08];
    e.fogDen = 0.009; e.skyFog = 0.9; e.sunCol = scalec(e.sunCol, 0.6); e.grip = 0.95; e.stars = 0;
  }
  return e;
}

  let x = rnd() * 100, rar = 'C';
  for (const r of RAR_ORDER) { const p = chest.odds[r] || 0; if (x < p) { rar = r; break; } x -= p; }

}
